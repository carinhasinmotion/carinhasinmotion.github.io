name: Optimize portfolio photos and hero video
on:
  push:
    branches:
      - fix-speed-players-ocubo-20261103
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Optimize photos and background video
        run: python scripts/optimize_portfolio_media.py
      - name: Commit optimized media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Index/hero.mp4 Index/thumbs/ Portfolio/
          git diff --cached --quiet || (git commit -m "Optimize image sizes, create light thumbnails and compress hero" && git push)
